spring.application.name=currency-rate-provider
server.port=8080

# Общий тег application для всех метрик — нужен для Grafana dashboard 4701
management.metrics.tags.application=${spring.application.name}

# Версия приложения (будет доступна в /actuator/info и выводиться в лог при старте)
info.app.version=0.0.1-SNAPSHOT

# Actuator: открываем эндпоинты для мониторинга
# health, info, metrics, prometheus — основные для observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Включаем детальную информацию в health (например, состояние БД)
management.endpoint.health.show-details=always

# Включаем percentile histogram для http.server.requests
# Это позволит Prometheus/Grafana вычислять P50, P95, P99 latency
# без хранения всех сырых данных (аппроксимация)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Ограничиваем диапазон ожидаемых значений latency (в ms) — оптимизация
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=5s

# Логирование HTTP-запросов (CommonsRequestLoggingFilter будет ниже)
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG