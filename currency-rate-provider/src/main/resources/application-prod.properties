# Prod-окружение: минимальное логирование, INFO уровень
logging.level.com.example.currency-rate-provider=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=INFO

# В production можно задать другое значение курса и разброса
rate.base=80.0
rate.variation=5.0

# Graceful shutdown для production — таймаут побольше
spring.lifecycle.timeout-per-shutdown-phase=60s