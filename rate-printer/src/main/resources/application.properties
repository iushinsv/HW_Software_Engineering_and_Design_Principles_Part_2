zookeeper.connect-string=localhost:2181

spring.application.name=rate-printer
server.port=8081

# Graceful shutdown — дожидаемся завершения запросов при SIGTERM (фактор IX)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Общий тег application для всех метрик — нужен для Grafana dashboard 4701
management.metrics.tags.application=${spring.application.name}

# Версия приложения
info.app.version=0.0.1-SNAPSHOT

# Actuator: открываем эндпоинты
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Включаем percentile histogram для http.server.requests (клиент тоже делает HTTP-запросы, 
# и Spring Actuator автоматически инструментирует RestTemplate)
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.distribution.minimum-expected-value.http.client.requests=1ms
management.metrics.distribution.maximum-expected-value.http.client.requests=5s