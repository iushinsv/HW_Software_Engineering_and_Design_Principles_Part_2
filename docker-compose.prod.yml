# Prod-окружение: production-профиль, полный мониторинг (Prometheus + Grafana)
version: "3.8"

services:
  zookeeper:
    image: zookeeper:3.8
    restart: always
    ports:
      - "2181:2181"
      - "7000:7000"
    environment:
      ZOO_CFG_EXTRA: "metricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider metricsProvider.httpPort=7000"

  postgres:
    image: postgres:16
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact
      POSTGRES_DB: pact

  pact-broker:
    image: pactfoundation/pact-broker:latest
    restart: always
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_DATABASE_URL: "postgres://pact:pact@postgres:5432/pact"
      PACT_BROKER_DATABASE_ADAPTER: postgres
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:latest
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - zookeeper
      - currency-rate-provider
      - rate-printer

  grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana-provisioning/dashboards/jvm-micrometer_4701.json:/var/lib/grafana/dashboards/jvm-micrometer_4701.json
    depends_on:
      - prometheus

  currency-rate-provider:
    build:
      context: ./currency-rate-provider
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ZOOKEEPER_CONNECT_STRING: zookeeper:2181
      SERVICE_ADDRESS: currency-rate-provider
    depends_on:
      - zookeeper
    # Логи пишутся в stdout (12-factor: фактор XI)

  rate-printer:
    build:
      context: ./rate-printer
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ZOOKEEPER_CONNECT_STRING: zookeeper:2181
    depends_on:
      - zookeeper
      - currency-rate-provider

volumes:
  grafana-data: