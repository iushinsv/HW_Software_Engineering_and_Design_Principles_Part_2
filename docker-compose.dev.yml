# Dev-окружение: сборка из исходников, dev-профиль, минимальная инфраструктура
version: "3.8"

services:
  zookeeper:
    image: zookeeper:3.8
    restart: always
    ports:
      - "2181:2181"

  currency-rate-provider:
    build:
      context: ./currency-rate-provider
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      ZOOKEEPER_CONNECT_STRING: zookeeper:2181
      SERVICE_ADDRESS: currency-rate-provider
    depends_on:
      - zookeeper
    # Логи пишутся в stdout (12-factor: фактор XI)

  rate-printer:
    build:
      context: ./rate-printer
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      ZOOKEEPER_CONNECT_STRING: zookeeper:2181
    depends_on:
      - zookeeper
      - currency-rate-provider